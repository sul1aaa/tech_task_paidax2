name: tech_task_paidax2
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.5.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.3.0

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.1.0
  flutter_bloc: ^9.1.1

  freezed_annotation: ^2.4.4    # ← downgrade this
  json_annotation: ^4.9.0
  shimmer: ^3.0.0
  video_player: ^2.9.5

dev_dependencies:
  freezed: ^2.5.7               # ← keep this
  json_serializable: ^6.8.0
  build_runner: ^2.4.9



  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/videos/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
